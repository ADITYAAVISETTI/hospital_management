<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Set a New Password | CityCare Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-page="reset">
  <div id="site-header"></div>
  <main class="auth-main" style="min-height:calc(100vh - 110px)">
    <div class="auth-card">
      <div class="card">
        <h1 style="font-size:1.7rem">Set a new password</h1>
        <form id="reset-form" novalidate>
          <div class="field" style="margin-bottom:14px">
            <label for="n-password">New password</label>
            <div class="input-icon">
              <i class="ri-lock-line"></i>
              <input id="n-password" name="password" type="password" required minlength="8" maxlength="64" pattern="(?=.*[A-Za-z])(?=.*\d).{8,64}" autocomplete="new-password">
              <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password"><i class="ri-eye-line"></i></button>
            </div>
            <span class="hint">At least 8 characters, with at least one letter and one number.</span>
          </div>
          <div class="field" style="margin-bottom:20px">
            <label for="n-password2">Confirm new password</label>
            <input id="n-password2" name="password2" type="password" required autocomplete="new-password">
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Save new password</button>
        </form>
        <div id="reset-invalid" class="hidden">
          <div class="alert alert-danger"><i class="ri-error-warning-line"></i><div>This reset link is incomplete. Please use the full link from the email, or request a new one.</div></div>
          <p style="margin-top:16px"><a class="btn btn-primary" href="forgot-password.html">Request a new link</a></p>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
