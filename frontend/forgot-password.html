<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CityCare Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-page="forgot">
  <div id="site-header"></div>
  <main class="auth-main" style="min-height:calc(100vh - 110px)">
    <div class="auth-card">
      <div class="card">
        <h1 style="font-size:1.7rem">Forgot your password?</h1>
        <p class="muted">Enter the email you registered with. We'll send you a link to set a new password.</p>
        <p class="muted small">Registered at the hospital desk? Use this too: it lets you set a password for online access.</p>
        <form id="forgot-form" novalidate>
          <div class="field" style="margin-bottom:18px">
            <label for="f-email">Email</label>
            <div class="input-icon"><i class="ri-mail-line"></i><input id="f-email" name="email" type="email" required autocomplete="email"></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
        </form>
        <div id="forgot-done" class="hidden">
          <div class="alert alert-success"><i class="ri-mail-check-line"></i><div id="forgot-message"></div></div>
          <p class="small muted" style="margin-top:14px">Didn't get it? Check your spam folder, or wait a minute and try again.</p>
        </div>
        <p style="margin:18px 0 0"><a href="login.html"><i class="ri-arrow-left-line"></i> Back to login</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
